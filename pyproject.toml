[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "docdrift"
version = "0.1.0"
description = "Catch documentation sentences that a pull request just made wrong."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
  { name = "Shivansh Gaur" },
  { name = "Ainish Singh" },
  { name = "Riyansh Bhosale" },
  { name = "Parth Jhawar" },
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
docdrift = "docdrift.cli:main"

[tool.setuptools.packages.find]
include = ["docdrift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
