name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code (full history, DocDrift reads git diffs)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run tests
        run: pytest -v
        env:
          # GitHub runners cannot host a 24 GB local model, so CI uses the
          # deterministic fake judge. Real Qwen output lives in examples/.
          DOCDRIFT_JUDGE: fake

      - name: Smoke-test the command line
        run: |
          python -m docdrift --version
          docdrift --help
